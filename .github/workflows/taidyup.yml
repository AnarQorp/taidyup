name: tAIdyup RC Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build, test and smoke the CLI artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install locked development dependencies
        run: npm ci

      - name: Build current checkout
        run: npm run build

      - name: Run regression suite
        run: npm test

      - name: Verify manifestless analysis and reports
        run: |
          mkdir -p .taidyup-ci
          node bin/taidyup.js validate .
          node bin/taidyup.js report . --output-dir .taidyup-ci

      - name: Pack and smoke fresh CLI install
        run: |
          npm pack --json > .taidyup-ci/pack.json
          TARBALL=$(node -e "const p=require('./.taidyup-ci/pack.json'); process.stdout.write(p[0].filename)")
          PREFIX=$(mktemp -d)
          npm install --prefix "$PREFIX" "./$TARBALL"
          "$PREFIX/node_modules/.bin/taidyup" --version
          "$PREFIX/node_modules/.bin/taidyup" --help

      - name: Upload SARIF Security Findings
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: .taidyup-ci/taidyup.sarif
